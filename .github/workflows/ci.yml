name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './**/*.md'

      - name: Validate markdown syntax
        run: |
          # Check if markdown files are valid
          for file in $(find . -name "*.md" -not -path "./node_modules/*"); do
            echo "Checking $file..."
            # Basic syntax check - ensure file is readable
            if [ ! -r "$file" ]; then
              echo "Error: $file is not readable"
              exit 1
            fi
          done

      - name: Detect secrets with gitleaks
        run: |
          # Purpose-built secret scanner; fails the job on any finding.
          GITLEAKS_VERSION="8.30.1"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" ;;
            Linux-aarch64) ASSET="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" ;;
            *) echo "Unsupported platform for gitleaks" >&2; exit 1 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --no-git --source . --redact --verbose

  test-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          # GitHub CLI is pre-installed on GitHub Actions runners
          gh --version

      - name: Validate skill structure
        run: |
          echo "Validating Issue Scout skill structure..."
          
          # Check required files exist
          required_files=(
            "SKILL.md"
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            ".gitignore"
          )
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file is missing"
              exit 1
            fi
          done
          
          # Check directories exist
          required_dirs=(
            "examples"
            "references"
            ".github"
          )
          
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✓ $dir/ directory exists"
            else
              echo "✗ $dir/ directory is missing"
              exit 1
            fi
          done
          
          echo "Skill structure validation passed!"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: |
          npx markdownlint '**/*.md' --config .markdownlint.json --ignore node_modules --ignore dist
